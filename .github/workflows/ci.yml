name: CI
on:
  push:
    branches: [main, release/**]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install bats (Unix)
        if: runner.os != 'Windows'
        run: |
          if command -v brew >/dev/null; then brew install bats-core shellcheck shfmt; fi
          if command -v apt-get >/dev/null; then sudo apt-get update && sudo apt-get install -y bats shellcheck; fi
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x bin/gcpctx scripts/*.sh test/helpers/bin/gcloud
          npm run verify
      - name: Smoke (Windows Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          chmod +x bin/gcpctx
          ./bin/gcpctx version
          ./bin/gcpctx help
          npm run pack:check
