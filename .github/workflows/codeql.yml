name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  security-events: write
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: github/codeql-action/init@192325c86100d080feab52942118f8ffdd932c18 # v3.29.5
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@192325c86100d080feab52942118f8ffdd932c18 # v3.29.5
