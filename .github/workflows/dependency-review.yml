name: Dependency review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-review:
    # Dependency review on private repos requires Dependency graph + GHAS.
    if: ${{ !github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
