name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck zip
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          test "$TAG" = "$PKG"
          test "$TAG" = "$(tr -d '[:space:]' < VERSION)"
      - name: Verify
        run: |
          chmod +x bin/gcpctx scripts/*.sh test/helpers/bin/gcloud
          npm run verify
      - name: Build artifacts
        run: bash scripts/build-release-artifacts.sh
      - name: Attest
        # Artifact attestations are unavailable on free private user repos.
        if: ${{ !github.event.repository.private || vars.ENABLE_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/gcpctx-*.tar.gz
            dist/gcpctx-*.zip
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/gcpctx-*.tar.gz
            dist/gcpctx-*.zip
            dist/checksums.txt
            dist/sbom.spdx.json
      - name: npm publish
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: |
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
